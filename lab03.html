<div id="app"><noscript><p style="padding:2rem;font-family:Arial">This lab needs JavaScript enabled.</p></noscript></div>

<script>
/* ===================== OrderDesk 2.0 simulator =====================
   Larkspur Industrial Supply. Twelve documented controls; each has a `works` flag that
   the processing logic below actually reads. Four are planted to fail: a check digit that
   is not enforced, a range check that lets negative quantities through, a missing credit
   limit hold, and batch totals that are not reduced when a line is deleted. Each failure
   is visible only when a suitable test transaction is submitted. */
(function () {
  var CONTROLS = [
    { id: 'C01', type: 'Input', name: 'Required fields', design: 'Customer ID, customer PO, SKU, quantity, and ship date are all required. A blank field rejects the order.', works: true },
    { id: 'C02', type: 'Input', name: 'Customer existence', design: 'The customer number must exist in the customer master. Unknown customers are rejected.', works: true },
    { id: 'C03', type: 'Input', name: 'Customer ID check digit', design: 'Customer ID is five digits, a hyphen, and a mod-11 check digit. The system recomputes the check digit and rejects a mismatch.', works: false },
    { id: 'C04', type: 'Input', name: 'Quantity format', design: 'Quantity must be a whole number. Decimals and text are rejected.', works: true },
    { id: 'C05', type: 'Input', name: 'Quantity range', design: 'Quantity per order must be from 1 to 500 units. Values outside the range are rejected.', works: false },
    { id: 'C06', type: 'Input', name: 'Product validity', design: 'The SKU must exist in the product master and be active. Discontinued SKUs are rejected.', works: true },
    { id: 'C07', type: 'Authorization', name: 'Customer on-hold block', design: 'Orders for customers with status On hold are rejected.', works: true },
    { id: 'C08', type: 'Processing', name: 'Credit limit hold', design: 'If the open balance plus this order would exceed the credit limit, the order is held for credit review instead of accepted.', works: false },
    { id: 'C09', type: 'Authorization', name: 'Price override limit', design: 'A unit price override may not be more than 10 percent below list price. Larger discounts are rejected.', works: true },
    { id: 'C10', type: 'Input', name: 'Duplicate PO check', design: 'A customer PO number already used by the same customer (on any order not deleted) is rejected as a duplicate.', works: true },
    { id: 'C11', type: 'Processing', name: 'Batch control totals', design: 'A batch posts only when the system record count and amount equal the control totals entered for the batch, including after any line is deleted.', works: false },
    { id: 'C12', type: 'Input', name: 'Ship date reasonableness', design: 'The requested ship date must be on or after the system date and no more than 90 days after it.', works: true }
  ];
  function cd(base) { var w = [6, 5, 4, 3, 2], s = 0; String(base).split('').forEach(function (d, i) { s += +d * w[i]; }); return (11 - s % 11) % 11; }
  var CUSTOMERS = [
    [40217, 'Fairhaven Machine Works', 50000, 12400, 'Active'],
    [41385, 'Osei Fabrication', 20000, 18750, 'Active'],
    [42660, 'Brightline Pump and Valve', 75000, 8100, 'Active'],
    [43912, 'Marisol Construction Group', 30000, 4250, 'On hold'],
    [45078, 'Tran Electric Supply', 15000, 2900, 'Active'],
    [46231, 'Redcliff Mining Services', 100000, 61300, 'Active'],
    [47704, 'Nakamura Robotics', 40000, 39200, 'Active'],
    [48159, 'Hollins Agricultural Co-op', 25000, 0, 'Active']
  ].map(function (r) { return { base: String(r[0]), id: r[0] + '-' + cd(r[0]), name: r[1], limit: r[2], balance: r[3], status: r[4] }; });
  var PRODUCTS = [
    ['HX-1020', 'Hex bolt kit, grade 8', 42.50, true], ['BR-2210', 'Ball bearing 6204', 18.75, true], ['PV-3305', 'Pressure valve, 2 in', 214.00, true],
    ['MT-4410', 'Motor, 5 HP', 1280.00, true], ['CB-5120', 'Conveyor belt, 10 m', 865.00, true], ['GL-6015', 'Nitrile gloves, case', 96.00, true],
    ['WR-7730', 'Wire rope, 100 ft', 310.00, false], ['FL-8840', 'Hydraulic filter', 57.25, true]
  ].map(function (r) { return { sku: r[0], desc: r[1], price: r[2], active: r[3] }; });
  var SYSDATE = '2026-11-16';
  var DAY = 86400000;
  function ms(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function usd(x) { return (x < 0 ? '−$' : '$') + Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  /* makeEngine(works): works(id) returns whether a control operates. The live app passes the
     control table's own flags; the self-test also builds an all-working engine to prove each
     scripted test would pass against a correct implementation. */
  function makeEngine(works) {
    function newState() { return { seq: 100001, bseq: 1001, batches: [{ no: 'B-1001', status: 'Open', ctlCount: null, ctlAmount: null, runCount: 0, runAmount: 0 }], orders: [], log: [] }; }
    function openBatch(st) { return st.batches.filter(function (b) { return b.status === 'Open'; })[0]; }
    function cust(base) { return CUSTOMERS.filter(function (c) { return c.base === base; })[0]; }
    function prod(sku) { return PRODUCTS.filter(function (p) { return p.sku === sku; })[0]; }
    function rej(ctl, msg) { return { outcome: 'Rejected', control: ctl, msg: msg }; }
    function submit(st, f) {
      var v = {}; ['cust', 'po', 'sku', 'qty', 'price', 'ship'].forEach(function (k) { v[k] = String(f[k] == null ? '' : f[k]).trim(); });
      v.sku = v.sku.toUpperCase(); v.po = v.po.toUpperCase();
      if (works('C01')) { var miss = [['cust', 'Customer ID'], ['po', 'Customer PO'], ['sku', 'SKU'], ['qty', 'Quantity'], ['ship', 'Ship date']].filter(function (x) { return !v[x[0]]; }); if (miss.length) return rej('C01', 'Required field missing: ' + miss.map(function (x) { return x[1]; }).join(', ') + '.'); }
      var m = /^(\d{5})-(\d)$/.exec(v.cust);
      if (!m) return rej('C03', 'Customer ID must be five digits, a hyphen, and a check digit (for example 12345-6).');
      if (works('C03') && cd(m[1]) !== +m[2]) return rej('C03', 'Customer ID check digit is not valid.');
      var c = cust(m[1]);
      if (works('C02') && !c) return rej('C02', 'Customer ' + v.cust + ' is not in the customer master.');
      if (works('C07') && c.status === 'On hold') return rej('C07', c.name + ' is on hold. Orders cannot be entered.');
      var p = prod(v.sku);
      if (works('C06') && (!p || !p.active)) return rej('C06', p ? 'SKU ' + v.sku + ' is discontinued.' : 'SKU ' + v.sku + ' is not in the product master.');
      if (works('C04') && !/^[-+]?\d+$/.test(v.qty)) return rej('C04', 'Quantity must be a whole number.');
      var q = parseInt(v.qty, 10);
      if (works('C05')) { if (q < 1 || q > 500) return rej('C05', 'Quantity must be from 1 to 500.'); }
      else { if (q === 0 || q > 500) return rej('C05', 'Quantity must be from 1 to 500.'); }   // planted flaw: lower bound only rejects zero
      var price = p.price;
      if (v.price) {
        var pv = Number(v.price.replace(/[$,]/g, ''));
        if (!(pv > 0)) return rej('C09', 'Unit price override must be a positive amount.');
        if (works('C09') && pv < r2(p.price * 0.9)) return rej('C09', 'Price override is more than 10 percent below list ($' + p.price.toFixed(2) + '). Supervisor pricing approval is required.');
        price = pv;
      }
      if (works('C12')) { var sd = /^\d{4}-\d{2}-\d{2}$/.test(v.ship) ? ms(v.ship) : NaN; if (isNaN(sd) || sd < ms(SYSDATE) || sd > ms(SYSDATE) + 90 * DAY) return rej('C12', 'Ship date must be from ' + SYSDATE + ' to 90 days after it.'); }
      if (works('C10') && st.orders.some(function (o) { return o.base === c.base && o.po === v.po && o.status !== 'Deleted'; })) return rej('C10', 'PO ' + v.po + ' has already been used by ' + c.name + '.');
      var amount = r2(q * price);
      var exposure = c.balance + st.orders.filter(function (o) { return o.base === c.base && (o.status === 'Accepted' || o.status === 'Posted'); }).reduce(function (s, o) { return s + o.amount; }, 0) + amount;
      var b = openBatch(st);
      var o = { no: String(st.seq++), batch: b.no, base: c.base, cust: v.cust, custName: c.name, po: v.po, sku: p.sku, qty: q, price: price, amount: amount, ship: v.ship, status: 'Accepted' };
      if (works('C08') && exposure > c.limit) { o.status = 'Held'; o.batch = ''; st.orders.push(o); return { outcome: 'Held', control: 'C08', msg: 'Order ' + o.no + ' for ' + c.name + ' is held for credit review. Open balance plus this order (' + usd(exposure) + ') exceeds the credit limit.', order: o }; }
      st.orders.push(o); b.runCount += 1; b.runAmount = r2(b.runAmount + amount);
      return { outcome: 'Accepted', control: '', msg: 'Order ' + o.no + ' accepted for ' + c.name + ' into batch ' + b.no + '.', order: o };
    }
    function sysTotals(st, b) {
      if (works('C11')) { var live = st.orders.filter(function (o) { return o.batch === b.no && (o.status === 'Accepted' || o.status === 'Posted'); }); return { count: live.length, amount: r2(live.reduce(function (s, o) { return s + o.amount; }, 0)) }; }
      return { count: b.runCount, amount: b.runAmount };   // planted flaw: running totals are never reduced on delete
    }
    function listed(st, b) { var live = st.orders.filter(function (o) { return o.batch === b.no && (o.status === 'Accepted' || o.status === 'Posted'); }); return { count: live.length, amount: r2(live.reduce(function (s, o) { return s + o.amount; }, 0)) }; }
    function del(st, no) { var o = st.orders.filter(function (x) { return x.no === no; })[0], b = openBatch(st); if (!o || o.status !== 'Accepted' || o.batch !== b.no) return false; o.status = 'Deleted'; return true; }
    function setTotals(st, count, amount) { var b = openBatch(st); b.ctlCount = count; b.ctlAmount = r2(amount); }
    function post(st) {
      var b = openBatch(st);
      if (b.ctlCount == null || b.ctlAmount == null) return { outcome: 'Blocked', msg: 'Enter the batch control totals before posting.' };
      var t = sysTotals(st, b);
      if (t.count !== b.ctlCount || Math.abs(t.amount - b.ctlAmount) > 0.005) return { outcome: 'Blocked', msg: 'Batch ' + b.no + ' is out of balance and cannot post. System totals: ' + t.count + ' orders, ' + usd(t.amount) + '. Control totals: ' + b.ctlCount + ' orders, ' + usd(b.ctlAmount) + '.' };
      st.orders.forEach(function (o) { if (o.batch === b.no && o.status === 'Accepted') o.status = 'Posted'; });
      b.status = 'Posted'; b.posted = { count: t.count, amount: t.amount };
      st.bseq += 1; st.batches.push({ no: 'B-' + st.bseq, status: 'Open', ctlCount: null, ctlAmount: null, runCount: 0, runAmount: 0 });
      return { outcome: 'Posted', msg: 'Batch ' + b.no + ' balanced and posted: ' + t.count + ' orders, ' + usd(t.amount) + '. Batch B-' + st.bseq + ' is now open.' };
    }
    return { newState: newState, submit: submit, del: del, setTotals: setTotals, post: post, sysTotals: sysTotals, listed: listed, openBatch: openBatch };
  }
  function flag(id) { return CONTROLS.filter(function (c) { return c.id === id; })[0].works; }
  window.B3 = { CONTROLS: CONTROLS, CUSTOMERS: CUSTOMERS, PRODUCTS: PRODUCTS, SYSDATE: SYSDATE, cd: cd, makeEngine: makeEngine, app: makeEngine(flag) };
})();
</script>

<script>
function b3Tests() { var s = window.LAB_API && LAB_API.note('app'); return s ? s.log.filter(function (l) { return l.kind === 'test'; }).length : 0; }
window.LAB = {
  id: 'B3',
  title: 'Application Controls Testing with Test Data',
  accent: 'Testing with Test Data',
  domain: 'Domain 3',
  time: '45–60 min',
  level: 'Intermediate',
  lessonHref: 'lesson04.html#s4',
  lessonLabel: 'Lesson 4, Control Identification & Design',
  lede: 'Test the controls, not the screens. Design valid and invalid transactions, run them through a working order-entry application, compare actual with expected results, and decide which failures block go-live.',
  workbenchTitle: 'Application test bench',
  ticket: {
    number: 'IA-2026-0588',
    priority: 'High priority',
    from: 'Esperanza Quintero, IT Audit Manager',
    to: 'IS audit staff (you)',
    subject: 'Pre-go-live application controls test: OrderDesk 2.0 order entry',
    due: 'Go-live recommendation before the November 23 steering committee',
    body: '<p>Larkspur Industrial Supply replaces its order-entry system with <b>OrderDesk 2.0</b> on November 30. The project team reports that user acceptance testing passed. The steering committee has asked internal audit for an independent view of the application controls before it approves release.</p>' +
      '<p>The release candidate, build <b>2.0.4-rc118</b>, is installed in the QA environment with a copy of the customer and product masters. The design document lists <b>twelve controls</b>: input edits, authorization checks, and batch processing controls. Your job is to test each one with <b>test data</b>: transactions you design, with the result you expect written down before you submit them.</p>' +
      '<p>Use valid and invalid values, and test both sides of every limit. Record every test in the test log. Do not ask the developers what the code does; the test results are the evidence.</p>' +
      '<p><b>Release criteria (steering committee charter):</b> no open critical or high defects. A <b>critical or high</b> defect lets an unauthorized or incorrect financial transaction post, or lets an incomplete batch post. A <b>medium</b> defect lets an input error through that another working control or a routine manual check is likely to catch. Medium defects may be released with an approved compensating control and a fix date within 30 days.</p>'
  },
  howTo: 'The <b>Application test bench</b> in step 2 is a working copy of OrderDesk. Enter an order, choose the control you are testing and the result you expect, then submit it. Use <b>Batch totals</b> to enter control totals and post a batch, and <b>Order register</b> to review or delete orders. Every test lands in the <b>Test log</b> with pass or fail. The <b>Test plan</b> tab lists the twelve controls and the master data. The failed-controls item unlocks after six logged tests. A hint is available for every item, and a revealed debrief earns no points. Team mode: one person drives the application while the team designs the next test.',
  workIntro: 'Design each test before you submit it: pick the control, choose the expected result, then compare. The application processes every transaction with its real logic, flaws included.',
  checklist: [
    { id: 'boundary', type: 'choice', points: 10, short: 'Boundary values', title: 'Design the range test',
      task: 'Control C05 limits quantity to <b>1 to 500</b> units. Which set of test quantities tests that control properly?',
      options: ['250, a typical quantity well inside the range', '−1, 0, 1, 500, and 501, at and beyond each limit', '1 and 500, the two documented limits only', '501 and 5,000, values above the maximum'],
      answer: 1,
      hint: 'A range check has two edges. Test each limit, one value just outside it, and a value well outside the lower edge, including a negative.',
      debrief: '<p>Boundary value analysis tests each edge and the values just beyond it. A quantity of 501 is rejected, so a test of the upper bound alone passes. Only a test below the lower bound reveals the flaw in OrderDesk: zero is rejected, but a negative quantity is accepted and creates a negative line amount.</p><p>The auditor’s lesson is that one passing test proves very little. Test data is only as good as the conditions the auditor designs into it, so every limit needs a test on each side.</p>',
      reviewNote: 'Test both edges of a range and the values just outside each edge.' },
    { id: 'failed', type: 'set', points: 20, short: 'Failed controls', title: 'Controls that failed testing',
      task: 'Using your test log, enter the ID of every control in the test plan that <b>did not operate as designed</b>.',
      label: 'Control IDs that failed', placeholder: 'e.g., C01, C02',
      locked: function () { return window.__b3unlock || b3Tests() >= 6 ? false : 'Run at least six test transactions in the application first. This item unlocks when six tests are in the test log (' + b3Tests() + ' so far).'; },
      answer: function () { return B3.CONTROLS.filter(function (c) { return !c.works; }).map(function (c) { return c.id; }); },
      hint: 'Write one invalid transaction per control, plus a valid baseline. For C08, pick a customer close to its credit limit. For C11, enter control totals, add two orders, delete one, then try to post.',
      debrief: '<p>Four controls failed. <b>C03</b>: a valid customer number with a wrong check digit (for example 40217-5) is accepted, so only the format is checked. <b>C05</b>: a negative quantity is accepted and produces a credit line. <b>C08</b>: an order that takes Osei Fabrication or Nakamura Robotics over its credit limit is accepted, not held. <b>C11</b>: after a line is deleted, the system totals still include it, so a batch balanced to the original totals posts while the register is one order short.</p><p>The other eight controls rejected or held every invalid transaction as designed. Each failure needs its test log entry as evidence: input, expected result, actual result. That is what lets the project team reproduce the defect and lets the auditor retest the fix.</p>',
      reviewNote: 'Design an invalid transaction for every control and compare actual with expected results.' },
    { id: 'batch', type: 'choice', points: 10, short: 'Batch total risk', title: 'The risk in the batch total failure',
      task: 'In your C11 test, the batch posted after a line was deleted. What risk does this failure create?',
      options: ['The same batch can be posted twice, duplicating every order in it', 'Users can delete orders from a batch that has already been posted', 'A batch posts after a line is deleted, so totals stop proving completeness', 'Control totals are hidden from the user who enters the orders'],
      answer: 2,
      hint: 'Batch control totals exist to prove that what posts is exactly what was entered and authorized. What happens to that proof when the system totals stop changing?',
      debrief: '<p>Batch control totals are a completeness and accuracy control. They work only if the system recomputes its totals from the lines that actually remain. OrderDesk adds to its running totals but never subtracts, so the batch reconciles to the original control totals even though fewer orders post. The register shows the difference; the batch screen does not.</p><p>Without this control, orders can be dropped or removed after balancing and no one is alerted. That meets the charter’s definition of a high defect: it lets an incomplete batch post.</p>',
      reviewNote: 'Batch totals prove completeness only if the system recomputes them after every change.' },
    { id: 'block', type: 'choice', points: 15, short: 'Go-live blockers', title: 'Which failures block go-live',
      task: 'Apply the release criteria in the ticket to the four failed controls. Which statement is the best recommendation?',
      options: ['C05, C08, and C11 block release; C03 can go live with a compensating check', 'Only C08 blocks release, because it is the only failure with financial exposure', 'None block release, because users can correct errors after orders are entered', 'All four block release, and the developers who fixed them should retest them'],
      answer: 0,
      hint: 'For each failure, ask whether it lets an unauthorized or incorrect transaction post, or an incomplete batch post. Then ask whether another working control catches most of the error.',
      debrief: '<p>C05, C08, and C11 each let an incorrect or unauthorized transaction post: negative quantities create unapproved credits, orders bypass the credit limit, and incomplete batches post. Under the charter they are high defects and block release. C03 is medium: the existence check still rejects unknown customers, and the acceptance message shows the customer name, so a clerk can catch most keying errors. It can go live with that confirmation step as an approved compensating control and a fix date within 30 days.</p><p>Retesting matters as much as fixing. Developers should not be the ones to confirm their own fixes; the auditor or an independent tester reruns the failed test transactions against the corrected build.</p>',
      reviewNote: 'Rate each failure against the release criteria and consider compensating controls.' },
    { id: 'tech', type: 'choice', points: 10, short: 'Technique', title: 'Name the technique and its limit',
      task: 'In this lab you entered fictitious transactions into a test copy of OrderDesk and compared the actual results with results you predicted. Which statement about this technique is accurate?',
      options: ['It is parallel simulation, because the auditor reprocesses production data', 'It is an integrated test facility, because it uses a dummy entity in live files', 'It proves the controls work on every transaction processed in production', 'It is test data, and it tests only the conditions the auditor includes'],
      answer: 3,
      hint: 'Where did the transactions come from, who designed them, and which copy of the program processed them?',
      debrief: '<p>This is the <b>test data</b> technique: auditor-designed transactions with predetermined expected results, run through the program in a controlled environment. Its strength is precision: each test targets one control. Its limit is coverage: it tests only the conditions the auditor thinks of, at one point in time, on one version of the program.</p><p>That limit is why the boundary item mattered. A test plan without a negative quantity would have reported C05 as working.</p>',
      reviewNote: 'Test data uses auditor-designed transactions with predetermined results in a test environment.' },
    { id: 'itf', type: 'choice', points: 10, short: 'ITF and simulation', title: 'Testing after go-live',
      task: 'After go-live, internal audit wants continuing assurance. <b>Option 1:</b> enter transactions for a fictitious customer in live OrderDesk, then reverse them. <b>Option 2:</b> rerun a month of real orders through audit software that replicates the pricing and credit logic, then compare the outputs. Which pair names the techniques correctly?',
      options: ['Option 1 is test data; Option 2 is an integrated test facility', 'Option 1 is an integrated test facility; Option 2 is parallel simulation', 'Option 1 is parallel simulation; Option 2 is a snapshot technique', 'Option 1 is a snapshot technique; Option 2 is test data'],
      answer: 1,
      hint: 'One technique puts auditor transactions into the live system. The other leaves the live system alone and reprocesses real data with the auditor’s own program.',

        '<h4 class="b3-h">Product master (QA copy)</h4><div class="table-wrap"><table class="data b3-t"><thead><tr><th scope="col">SKU</th><th scope="col">Description</th><th scope="col" class="num">List price</th><th scope="col">Status</th></tr></thead><tbody>' +

    }

  }

  function w(o) { var r = {}; for (var k in V) r[k] = V[k]; for (var j in o) r[j] = o[j]; return r; }
  var scripts = [
    ['Baseline', function (E, s) { return E.submit(s, w({})).outcome; }, 'Accepted'],
    ['C01', function (E, s) { return E.submit(s, w({ po: '' })).outcome; }, 'Rejected'],
    ['C02', function (E, s) { return E.submit(s, w({ cust: ghostId })).outcome; }, 'Rejected'],
    ['C03', function (E, s) { return E.submit(s, w({ cust: wrongCd })).outcome; }, 'Rejected'],
    ['C04', function (E, s) { return E.submit(s, w({ qty: '2.5' })).outcome; }, 'Rejected'],
    ['C05', function (E, s) { var a = E.submit(s, w({ qty: '-5' })).outcome, b = E.submit(s, w({ qty: '501', po: 'T-002' })).outcome; return a === 'Rejected' && b === 'Rejected' ? 'Rejected' : 'Accepted'; }, 'Rejected'],
    ['C06', function (E, s) { return E.submit(s, w({ sku: 'WR-7730' })).outcome; }, 'Rejected'],
    ['C07', function (E, s) { return E.submit(s, w({ cust: B3.CUSTOMERS[3].id })).outcome; }, 'Rejected'],
    ['C08', function (E, s) { return E.submit(s, w({ cust: B3.CUSTOMERS[1].id, sku: 'MT-4410', qty: '1' })).outcome; }, 'Held'],
    ['C09', function (E, s) { return E.submit(s, w({ price: '30.00' })).outcome; }, 'Rejected'],
    ['C10', function (E, s) { E.submit(s, w({})); return E.submit(s, w({ qty: '4' })).outcome; }, 'Rejected'],
    ['C11', function (E, s) { var a = E.submit(s, w({ po: 'T-101' })), b = E.submit(s, w({ po: 'T-102', qty: '3' })); E.setTotals(s, 2, a.order.amount + b.order.amount); E.del(s, b.order.no); return E.post(s).outcome; }, 'Blocked'],
    ['C12', function (E, s) { return E.submit(s, w({ ship: '2026-11-01' })).outcome; }, 'Rejected']
  ];
  function run(E) { return scripts.filter(function (sc) { return sc[1](E, E.newState()) !== sc[2]; }).map(function (sc) { return sc[0]; }); }
  var real = run(B3.app), ideal = run(B3.makeEngine(function () { return true; }));
  var flagged = B3.CONTROLS.filter(function (c) { return !c.works; }).map(function (c) { return c.id; });
  log.push('failing=' + real.join(',')); log.push('allWorkingFailures=' + (ideal.join(',') || 'none'));
  if (real.join(',') !== flagged.join(',')) P.push('scripted failures ' + real.join(',') + ' differ from control table ' + flagged.join(','));
  if (flagged.join(',') !== 'C03,C05,C08,C11') P.push('control table does not plant C03, C05, C08, C11');
  if (ideal.length) P.push('scripts fail even on a correct engine: ' + ideal.join(','));
  // Check digits: no master customer may have a check digit of 10, and the example in the plan must hold.
  B3.CUSTOMERS.forEach(function (c) { if (B3.cd(c.base) > 9) P.push('check digit 10 for ' + c.base); });
  if (B3.cd('40217') !== 6) P.push('plan example check digit is wrong');
  if (B3.CUSTOMERS.some(function (c) { return c.base === ghost; })) P.push('ghost customer exists');
  // The credit script must exceed the limit by design, and a normal baseline must stay under it.
  var osei = B3.CUSTOMERS[1]; if (!(osei.balance + 1280 > osei.limit)) P.push('C08 script would not exceed the limit');
  // Visible symptom of C11: listed register totals differ from system totals after a delete.
  var E = B3.app, s = E.newState(), a = E.submit(s, w({ po: 'X1' })), b = E.submit(s, w({ po: 'X2' })); E.del(s, b.order.no);
  var bt = E.openBatch(s); if (E.sysTotals(s, bt).count === E.listed(s, bt).count) P.push('C11 failure not visible in the register');
  return { log: log, problems: P };
};
