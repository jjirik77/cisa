        { title: 'Customer portal', label: 'RTO', answer: 8, unit: 'hours', why: 'Impact reaches $210K at 8 hours and $380K at 24 hours, so the RTO is 8 hours.' },

    {

      review: { href: 'lesson06.html#s5', label: 'Lesson 6, Disaster Recovery Plan' },
      items: [
        {
          title: 'Case 1: Order management (former Lab 7)', text: 'The BIA sets order management at an RTO of 4 hours and an RPO of 1 hour. The DR arrangement is a warm site fed by nightly off-site backups. A restore takes about 8 hours, and recovered data can be up to 24 hours old. Repeated DR tests recover the system in 10 to 12 hours.',
          parts: [
            { q: 'How does the tested recovery compare with the RTO?', concept: 'gap', options: ['It meets the RTO, because the warm site is pre-configured', 'It misses the 4-hour RTO by 6 to 8 hours, a significant finding', 'It is acceptable, because 10 to 12 hours is typical for a warm site', 'It cannot be judged until a full-interruption test is run'], answer: 1, why: 'Repeated tests show 10 to 12 hours against a 4-hour requirement. A DRP whose tested capability misses the BIA target is a finding, not a qualification.' },

          ]
        },
        {
          title: 'Case 2: Customer portal', text: 'The customer portal (RTO 8 hours, RPO 4 hours) runs active-active across two data centers with synchronous replication. Failover tests complete in under 5 minutes. The arrangement costs $1.1 million a year, and the CFO has asked internal audit whether it is justified.',
          parts: [
            { q: 'What should the auditor conclude?', concept: 'strategy', options: ['An over-build that management should weigh against the BIA', 'No issue, since added resilience always lowers risk', 'A gap, because synchronous replication cannot meet a 4-hour RPO', 'A gap, because active-active sites need a 0-hour RTO in the BIA'], answer: 0, why: 'Capability far exceeds what the BIA requires. The auditor reports that the spend is not supported by the business impact and leaves the decision to management.' },
            { q: 'Which strategy would BEST fit the portal\'s targets?', concept: 'strategy', options: ['Cold site with weekly full backups shipped off-site', 'Warm site with replication or backups at least every 4 hours', 'Hot site with synchronous replication, as it is today', 'A reciprocal agreement with a partner firm and nightly backups'], answer: 1, why: 'A warm site can recover within 8 hours, and a 4-hour data capture cycle meets the RPO. A cold site and nightly backups would under-build; the current hot site over-builds.' }
          ]
        },
        {
          title: 'Case 3: Payroll', text: 'Payroll (RTO 24 hours, RPO 24 hours) takes a full backup each Sunday and an incremental backup each night at 23:00, all stored off-site. Recovery is to a warm site. In the last restore test, run on a Friday, the team needed the full backup plus five incrementals. The restore took 30 hours, partly because one incremental tape was unreadable.',
          parts: [
            { q: 'Does the backup schedule meet the 24-hour RPO?', concept: 'strategy', options: ['No, because incremental backups capture only changed data', 'No, because the full backup runs only once a week', 'Yes, because a backup is taken at least every 24 hours', 'Yes, because the warm site holds a live copy of the data'], answer: 2, why: 'Nightly backups cap data loss at about one day, which meets the RPO. Incrementals still capture every change since the previous backup.' },
            { q: 'Which change BEST addresses the RTO miss?', concept: 'strategy', options: ['Replace daily incrementals with daily differentials', 'Add a second incremental backup each afternoon at 14:00', 'Move payroll to an active-active hot site with replication', 'Ask the BIA owner to raise the payroll RTO to 36 hours'], answer: 0, why: 'A differential restore needs only the last full backup and one differential, so the chain is shorter and has fewer media to fail. A hot site would over-build for a 24-hour target.' }
          ]
        },
        {
          title: 'Case 4: After remediation', text: 'Order management now replicates synchronously to a hot site. Recovery tests meet both targets. To save money, the infrastructure lead, Kwame Asante, plans to retire the tape backups because "replication makes them redundant."',
          parts: [
            { q: 'What is the main risk in this plan?', concept: 'strategy', options: ['The hot site may run more slowly than the primary data center', 'Synchronous replication is too slow to meet a 1-hour RPO', 'ISACA standards require tape for every critical system', 'Corruption or ransomware replicates to the hot site too'], answer: 3, why: 'Replication copies every change, including corrupted or encrypted data. Point-in-time backups, ideally offline or immutable, are still needed to recover to a clean state.' }
          ]
        },
        {
          title: 'Case 5: Inventory backups', text: 'The inventory system is backed up nightly to an off-site vault. Backup software logs show a 100 percent success rate for two years. The operations manager, Lucía Ferraro, confirms that no restore has been performed in that time.',
          parts: [
            { q: 'What is the auditor\'s FIRST concern?', concept: 'testing', options: ['Nightly backups are too frequent for an inventory system', 'The backup software vendor may no longer be supported', 'No one has shown the backups can be restored', 'Backups should be full rather than incremental'], answer: 2, why: 'A successful backup job proves only that data was written. Without documented restoration tests, the backup program cannot be considered effective.' }
          ]
        },
        {
          title: 'Case 6: Site selection', text: 'Choose the recovery site that meets each target at the lowest reasonable cost.',
          parts: [
            { q: 'A trading platform with an RTO of 1 hour and an RPO near zero', concept: 'strategy', options: ['Hot site', 'Warm site', 'Cold site', 'Cloud DR (DRaaS)'], answer: 0, why: 'Only a fully equipped site with real-time synchronization recovers in minutes to hours with almost no data loss.' },
            { q: 'An archived-records system with an RTO of 3 weeks and a small budget', concept: 'strategy', options: ['Hot site', 'Warm site', 'Cold site', 'Cloud DR (DRaaS)'], answer: 2, why: 'A cold site provides space and power, and equipment is procured after the event. That takes days to weeks, which this target allows at the lowest cost.' },
            { q: 'A claims-processing system with an RTO of 2 days, where pre-configured hardware and a data restore are acceptable', concept: 'strategy', options: ['Hot site', 'Warm site', 'Cold site', 'Cloud DR (DRaaS)'], answer: 1, why: 'A warm site has hardware ready but needs data restored, which fits a recovery window of hours to days.' },
            { q: 'A seasonal e-commerce site whose capacity triples in December, where management wants to pay only for capacity it uses', concept: 'strategy', options: ['Hot site', 'Warm site', 'Cold site', 'Cloud DR (DRaaS)'], answer: 3, why: 'Cloud DR offers elastic capacity on a pay-per-use basis, which suits highly variable demand.' }
          ]
        }

      review: { href: 'lesson06.html#s4', label: 'Lesson 6, Business Continuity Plan testing' },
      groups: [

            { text: 'Parallel test: recovery systems are brought up at the alternate site while production keeps running', rank: 4, why: 'A parallel test proves recovery capability with moderate risk, because production is not shut down.' },
            { text: 'Checklist review: team members confirm the plan\'s contact lists, inventories, and procedures are current', rank: 0, why: 'A desk check of plan content involves no exercise and no disruption.' },
            { text: 'Full interruption: production is shut down and operations move to the recovery site', rank: 5, why: 'This is the most realistic and most disruptive test. It is used sparingly and only with careful planning.' },
            { text: 'Tabletop exercise: the team discusses its response to a described scenario around a table', rank: 1, accept: [1, 2], why: 'Tabletop and structured walkthrough tests are both discussion-based with little or no disruption, so either order is accepted.' },
            { text: 'Simulation: the team carries out its response to a realistic scenario, short of recovering production', rank: 3, why: 'A simulation tests decisions and actions under a scenario at low risk, without moving production.' },
            { text: 'Structured walkthrough: each team member walks through their steps in the plan, in sequence', rank: 2, accept: [1, 2], why: 'Tabletop and structured walkthrough tests are both discussion-based with little or no disruption, so either order is accepted.' }
          ]

          title: 'From business impact to verified recovery', concept: 'gap', topLabel: 'First step', bottomLabel: 'Last step',
          items: [
            { text: 'Select backup and recovery-site strategies that meet the targets', rank: 3, why: 'Strategy is chosen only after the targets exist. Strategy follows the BIA.' },
            { text: 'Quantify the impact of an outage and of lost data over time', rank: 1, why: 'Impact over time is the input that turns into RTO and RPO.' },
            { text: 'Compare tested results with the BIA targets and report any gap', rank: 5, why: 'The auditor\'s conclusion rests on tested capability against the BIA requirement.' },
            { text: 'Identify critical business processes and their owners', rank: 0, why: 'The BIA starts with the business processes and the people accountable for them.' },
            { text: 'Test the recovery and record the RTO and RPO actually achieved', rank: 4, why: 'Testing turns a design into evidence. Untested capability is assumed, not verified.' },
            { text: 'Set the RTO and RPO for each process', rank: 2, why: 'Targets come from the impact data and are approved by the business owner.' }
          ]
        }
      ]
    },
    {
      type: 'reflect', short: 'Reflect', title: 'Reflect on your readiness',
      instr: 'Rate your confidence on each concept, then answer the prompts. Your responses appear in the summary report.',
      prompts: [
        { key: 'shift', label: 'Think of a system you know well. Is its recovery strategy driven by a BIA target, or by what IT happened to build? How would an auditor tell the difference?' },
        { key: 'next', label: 'Which concept from this activity will you review before the next lesson, and how?' }
      ]
    }
  ]
