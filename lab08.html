<script>
/* ===================== Synthetic evidence (deterministic) =====================
   Cobalt Ridge Credit Union: credential-theft incident, night of September 11 to 12, 2026.
   The authentication log and EDR log are in UTC. The VPN appliance clock runs 38 minutes
   slow (NTP sync failure), so its device time must be normalized. */
(function () {
  var seed = 8808;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function pad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
  var S = 1000, M = 60000, H = 3600000;
  function ts(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1, 2) + '-' + pad(d.getUTCDate(), 2) + ' ' + pad(d.getUTCHours(), 2) + ':' + pad(d.getUTCMinutes(), 2) + ':' + pad(d.getUTCSeconds(), 2); }
  function hex(n) { var s = ''; while (s.length < n) s += '0123456789abcdef'[ri(0, 15)]; return s; }
  var OFFSET = 38 * M;  // VPN device time = UTC - 38 minutes
  var D0 = Date.UTC(2026, 8, 12, 0, 0, 0);
  function T(h, m, s) { return D0 + h * H + m * M + (s || 0) * S; }
  var ATK = '185.220.101.47', FS02 = '10.40.2.15', BKP = '10.40.2.30', VIP = '10.40.8.23';

  var spray = ['dlewis', 'mchavez', 'rsingh', 'kwalsh'];

  var auth = [], vpn = [], edr = [];

  function E(t, host, user, type, detail, sev, tag) { edr.push({ t: t, host: host, user: user, type: type, detail: detail, sev: sev, tag: tag || '' }); }
  var sid = 88340;

    vpn.push({ t: end - OFFSET, user: user, src_ip: ip, assigned_ip: tag ? VIP : '10.40.8.' + ri(30, 200), event: 'Session end', session_id: id, bytes: String(bytes), tag: tag || '' });

    session(u, homeIp[u], st, en, ri(2, 900) * 100000);
  });
  vpnUsers.forEach(function (u) {
    for (var i = 0; i < ri(1, 3); i++) A(T(0, 0) + ri(0, 380) * M + ri(0, 59) * S, u, homeIp[u], pick(['Microsoft 365', 'Core banking', 'Microsoft 365']), 'Success', pick(['Push approved', 'Token (existing session)']), '');
  });
  staff.slice(11).forEach(function (u) {
    var ws = 'WS-CC-' + pad(ri(1, 9), 2), ip = '10.40.5.' + ri(20, 90);
    for (var i = 0; i < ri(2, 4); i++) A(T(0, 0) + ri(0, 380) * M + ri(0, 59) * S, u, ip, pick(['Workstation logon', 'Core banking', 'Microsoft 365']), 'Success', 'n/a (on premises)', '');
    if (rnd() < 0.5) A(T(0, 0) + ri(0, 380) * M, u, ip, 'Core banking', 'Failure: bad password', 'n/a (on premises)', '');
    E(T(0, 0) + ri(0, 380) * M + ri(0, 59) * S, ws, u, 'User logon', 'Interactive logon (console)', 'Info');

  });

  A(T(1, 0, 4), 'svc-backup', BKP, 'Domain (Kerberos)', 'Success', 'n/a (service)', '');

  });
  for (i = 0; i < 6; i++) E(T(0, 0) + ri(0, 380) * M + ri(0, 59) * S, pick(['DC01', 'APP03']), 'SYSTEM', 'Process start', pick(['svchost.exe -k netsvcs', 'dfsrs.exe', 'w3wp.exe', 'sqlservr.exe']), 'Info');

  // ---- Attack ----
  E(Date.UTC(2026, 8, 11, 19, 22, 41), 'WS-AP-14', 'mrios', 'File opened', 'Remittance_0911.iso mounted from email attachment; Remit.lnk launched powershell.exe', 'Medium', 'atk');
  E(Date.UTC(2026, 8, 11, 19, 22, 58), 'WS-AP-14', 'mrios', 'Network connection', 'powershell.exe downloaded payload from cdn-remit-portal[.]com', 'Medium', 'atk');
  E(Date.UTC(2026, 8, 11, 19, 23, 12), 'WS-AP-14', 'mrios', 'Credential access', 'Unknown process rtk.exe read browser saved-password store (alert queued, not blocked)', 'Medium', 'atk');
  spray.forEach(function (u, k) { A(T(1, 31 + k * 3, ri(0, 59)), u, ATK, 'VPN (RADIUS)', 'Failure: bad password', 'None', '', 'atk'); });
  for (i = 0; i < 9; i++) A(T(1, 52 + i * 2, ri(0, 50)), 'mrios', ATK, 'VPN (RADIUS)', 'Failure: MFA push denied', 'Push denied', '', 'atk');
  var atkSession = session('mrios', ATK, T(2, 13, 11), T(3, 26, 30), 2264000000, 'atk');
  auth.forEach(function (a) { if (a.session_ref === atkSession) { a.t = T(2, 13, 7); a.tag = 'initial'; } });
  E(T(2, 27, 14), 'FS02', 'mrios', 'User logon', 'Remote desktop logon from ' + VIP, 'Low', 'atk');
  E(T(2, 33, 2), 'FS02', 'mrios', 'Process start', 'whoami /groups; net group "Domain Admins" /domain', 'Low', 'atk');
  E(T(2, 41, 5), 'FS02', 'mrios', 'Credential access', 'rundll32.exe comsvcs.dll MiniDump of lsass.exe (credential dumping)', 'High', 'atk');
  E(T(2, 49, 30), 'FS02', 'mrios', 'Explicit credentials', 'Logon with explicit credentials: svc-backup to DC01', 'Medium', 'atk');
  A(T(2, 49, 31), 'svc-backup', FS02, 'Domain (Kerberos)', 'Success', 'n/a (service)', '', 'atk');
  A(T(2, 55, 48), 'svc-backup', FS02, 'Domain (Kerberos)', 'Success', 'n/a (service)', '', 'atk');
  E(T(2, 56, 20), 'DC01', 'svc-backup', 'Persistence', 'Scheduled task \\Microsoft\\Windows\\UpdateCheck created, runs C:\\ProgramData\\upd.exe', 'High', 'atk');
  E(T(3, 1, 44), 'FS02', 'mrios', 'File activity', 'Archive created: C:\\Temp\\hr_share.7z (2.1 GB)', 'Medium', 'atk');
  A(T(3, 5, 40), 'mrios', '10.40.1.12', 'Admin action', 'Account disabled by jokoro; IdP sessions revoked', 'n/a', '', 'resp');
  E(T(3, 9, 31), 'WS-AP-14', 'jokoro', 'Remediation', 'Remediation run: 3 files quarantined, 2 processes terminated', 'Info', 'resp');
  E(T(3, 12, 6), 'FS02', 'mrios', 'Network connection', 'Outbound transfer of 2.1 GB to ' + VIP + ' over RDP channel', 'High', 'atk');
  E(T(3, 16, 2), 'FS02', 'SYSTEM', 'Agent status', 'Agent offline: host shut down', 'Info', 'resp');
  E(T(3, 44, 20), 'WS-AP-14', 'jokoro', 'Containment', 'Network containment enabled on host', 'Info', 'resp');

  // ---- Numbering (time order, gaps from other tenants or filtered rows) ----
  function number(list, prefix, start) { list.sort(function (a, b) { return a.t - b.t; }); var n = start; list.forEach(function (r) { n += ri(1, 3); r.id = prefix + n; }); }
  number(auth, 'AUTH-', 40210); number(vpn, 'VPN-', 7730); number(edr, 'EDR-', 991200);

  // ---- Response action log ----
  var acts = [
    ['A01', T(3, 2, 10), 'Wen Li (SOC)', 'Triaged EDR credential-dumping alert on FS02; declared incident IR-2026-031; paged IR lead', '', { k: 'detect' }],
    ['A02', T(3, 5, 40), 'Jamal Okoro (IR lead)', 'Disabled mrios in the directory and revoked identity provider sessions', '', { k: 'contain', host: 'identity' }],
    ['A03', T(3, 9, 31), 'Jamal Okoro (IR lead)', 'Ran EDR remediation on WS-AP-14: quarantined dropped files and terminated malicious processes', '', { k: 'eradicate', host: 'WS-AP-14' }],
    ['A04', T(3, 16, 0), 'Adwoa Mensah (IR analyst)', 'Powered off FS02 “to stop the damage”', '', { k: 'poweroff', host: 'FS02' }],
    ['A05', T(3, 31, 0), 'Adwoa Mensah (IR analyst)', 'Acquired disk image of FS02 with write blocker', 'IMG-01', { k: 'image', host: 'FS02' }],
    ['A06', T(3, 44, 20), 'Jamal Okoro (IR lead)', 'Enabled EDR network containment on WS-AP-14', '', { k: 'contain', host: 'WS-AP-14' }],
    ['A07', T(3, 58, 0), 'Adwoa Mensah (IR analyst)', 'Captured memory of WS-AP-14', 'IMG-02', { k: 'memory', host: 'WS-AP-14' }],
    ['A08', T(4, 12, 0), 'Jamal Okoro (IR lead)', 'Acquired disk image of WS-AP-14', 'IMG-03', { k: 'image', host: 'WS-AP-14' }],
    ['A09', T(4, 35, 0), 'Tomasz Wiśniewski (infrastructure)', 'Restored FS02 from the September 11 backup and returned it to production', '', { k: 'recover', host: 'FS02' }],
    ['A10', T(5, 5, 0), 'Tomasz Wiśniewski (infrastructure)', 'Deleted malicious scheduled task UpdateCheck and upd.exe from DC01', '', { k: 'eradicate', host: 'DC01' }],
    ['A11', T(5, 20, 0), 'Jamal Okoro (IR lead)', 'Reset svc-backup password; reset krbtgt account password twice', '', { k: 'eradicate', host: 'identity' }],
    ['A12', T(5, 48, 0), 'Adwoa Mensah (IR analyst)', 'Collected DC01 event logs and acquired disk image of DC01', 'IMG-04', { k: 'image', host: 'DC01' }],
    ['A13', T(6, 20, 0), 'Adwoa Mensah (IR analyst)', 'Exported VPN appliance log and identity provider authentication log for the incident window', 'IMG-05, IMG-06', { k: 'collect', host: 'logs' }],
    ['A14', Date.UTC(2026, 8, 14, 15, 0, 0), 'Jamal Okoro (IR lead)', 'Held lessons-learned meeting; draft report circulated', '', { k: 'post' }]
  ];
  var actions = acts.map(function (a) { return { action_id: a[0], time_utc: ts(a[1]), responder: a[2], action: a[3], evidence_ref: a[4], _k: a[5] }; });

  // ---- Hashes and custody ----
  var imgs = [['IMG-01', 'FS02 disk image (E01)', 'FS02', 'A05'], ['IMG-02', 'WS-AP-14 memory capture (raw)', 'WS-AP-14', 'A07'], ['IMG-03', 'WS-AP-14 disk image (E01)', 'WS-AP-14', 'A08'], ['IMG-04', 'DC01 disk image and event logs (E01)', 'DC01', 'A12'], ['IMG-05', 'VPN appliance log export (CSV)', 'VPN-GW-01', 'A13'], ['IMG-06', 'Identity provider authentication log export (JSON)', 'IdP', 'A13']];
  var hashes = imgs.map(function (m) {
    var h = hex(64), r = h;
    if (m[0] === 'IMG-03') { r = h.slice(0, 27) + hex(9) + h.slice(36); if (r === h) r = h.slice(0, 27) + 'f00dcafe1' + h.slice(36); }
    return { item: m[0], description: m[1], source_host: m[2], acquired_in: m[3], recorded_sha256: h, recomputed_sha256: r, recomputed_on: '2026-10-20' };
  });
  var H = {}; hashes.forEach(function (h) { H[h.item] = h.recorded_sha256; });
  var forms = [
    { form: 'CoC-01', item: 'IMG-01', desc: 'FS02 disk image on evidence drive ED-114', collected_by: 'Adwoa Mensah', collected_at: '2026-09-12 03:31 to 04:02', hash: H['IMG-01'], seal: 'Bag EB-2210, seal intact', transfers: [['2026-09-12 04:15', 'Adwoa Mensah', 'Luis Ortiz (evidence custodian)', 'Storage, evidence locker 2', 'Signed', 'Signed'], ['2026-09-15 09:10', 'Luis Ortiz (evidence custodian)', 'Priya Raman (forensic examiner)', 'Analysis', 'Signed', 'Signed'], ['2026-09-15 17:40', 'Priya Raman (forensic examiner)', 'Luis Ortiz (evidence custodian)', 'Return to locker', 'Signed', 'Signed']] },
    { form: 'CoC-02', item: 'IMG-02', desc: 'WS-AP-14 memory capture on evidence drive ED-115', collected_by: 'Adwoa Mensah', collected_at: '2026-09-12 03:58 to 04:06', hash: '', seal: 'Bag EB-2211, seal intact', transfers: [['2026-09-12 04:30', 'Adwoa Mensah', 'Luis Ortiz (evidence custodian)', 'Storage, evidence locker 2', 'Signed', ''], ['2026-09-15 09:12', 'Luis Ortiz (evidence custodian)', 'Priya Raman (forensic examiner)', 'Analysis', 'Signed', 'Signed']] },
    { form: 'CoC-03', item: 'IMG-03', desc: 'WS-AP-14 disk image on evidence drive ED-116', collected_by: 'Jamal Okoro', collected_at: '2026-09-12 04:12 to 04:36', hash: H['IMG-03'], seal: 'Bag EB-2212, seal replaced (no reason recorded)', transfers: [['2026-09-12 04:40', 'Jamal Okoro', 'Luis Ortiz (evidence custodian)', 'Storage, evidence locker 2', 'Signed', 'Signed'], ['2026-09-13 22:55', 'Daniel Kim (IT support)', 'Priya Raman (forensic examiner)', 'Analysis', 'Signed', 'Signed']] },
    { form: 'CoC-04', item: 'IMG-04', desc: 'DC01 disk image and event logs on evidence drive ED-117', collected_by: 'Adwoa Mensah', collected_at: '2026-09-12 05:48 to 06:31', hash: H['IMG-04'], seal: 'Bag EB-2213, seal intact', transfers: [['2026-09-12 06:40', 'Adwoa Mensah', 'Luis Ortiz (evidence custodian)', 'Storage, evidence locker 2', 'Signed', 'Signed'], ['2026-09-16 10:05', 'Luis Ortiz (evidence custodian)', 'Priya Raman (forensic examiner)', 'Analysis', 'Signed', 'Signed']] }
  ];
  var transfers = [];
  forms.forEach(function (f) { f.transfers.forEach(function (t, k) { transfers.push({ form: f.form, item: f.item, step: String(k + 1), date_time: t[0], released_by: t[1], received_by: t[2], purpose: t[3], released_sig: t[4], received_sig: t[5] }); }); });

  window.B8DATA = {
    auth: auth.map(function (a) { return { event_id: a.id, time_utc: ts(a.t), user: a.user, src_ip: a.src_ip, app: a.app, result: a.result, mfa: a.mfa, session_ref: a.session_ref }; }),
    vpn: vpn.map(function (v) { return { vpn_id: v.id, device_time: ts(v.t), user: v.user, src_ip: v.src_ip, assigned_ip: v.assigned_ip, event: v.event, session_id: v.session_id, bytes: v.bytes }; }),

    actions: actions, hashes: hashes, forms: forms, transfers: transfers, attackerIp: ATK,
    answers: {

    }

<script>
(function () {

        '<p>The committee wants an independent view. Using the evidence package, establish what happened and when, then evaluate the response. Did the team act in the right order? Was volatile evidence preserved? Will the images and custody records stand up? Do our logs meet the retention standard?</p>' +

        answer: A('offset'), tol: 0.5, unit: 'minutes',
        hint: 'Put the VPN log in pane A and the authentication log in pane B. Match session_id to session_ref and look up time_utc. Compare device_time with the looked-up UTC time for a few sessions.',
        debrief: '<p>For every session, the RADIUS authentication in UTC is about 38 minutes later than the VPN device time, less the few seconds the appliance takes to build the tunnel after the authentication. The appliance clock is 38 minutes slow; the Policies tab shows its NTP synchronization has failed since July 30. Add 38 minutes to every VPN time.</p><p>Without normalization, the attacker’s VPN session appears to start 38 minutes before the credential was ever accepted and to end before the account was disabled. Both readings are wrong. Time synchronization is a logging control the auditor should test, because unsynchronized clocks weaken both the investigation and any later legal use of the logs.</p>',
        reviewNote: 'Use matching events across sources to measure clock offset before building a timeline.' },
      { id: 'initial', type: 'set', points: 12, short: 'Initial access', title: 'Identify the initial access event',
        task: 'Which <b>authentication log event</b> records the attacker’s first <b>successful</b> use of the stolen credential? Enter the event ID.',
        label: 'Authentication event ID', placeholder: 'e.g., AUTH-40311',
        answer: A('initial'),
        hint: 'Filter the authentication log on the external address that keeps failing in the early morning. Failures do not count. Look for the first success from that address.',
        debrief: '<p>From 01:31 UTC the address ' + X.attackerIp + ' tried a short password spray against four accounts and failed. It then sent nine MFA push requests to mrios, all denied, and at 02:13:07 the tenth push was approved. That event is the initial access: the VPN session from the same address starts four seconds later in normalized time. The EDR log shows how the password was stolen: an ISO attachment opened on WS-AP-14 the evening before ran an infostealer that read the browser’s saved passwords.</p><p>The MFA fatigue pattern and the infostealer alert that sat in the queue overnight are both detection gaps. The auditor should recommend number matching or phishing-resistant MFA, lockout after repeated denied pushes, and triage targets for medium-severity credential-access alerts.</p>',
        reviewNote: 'Initial access is the first successful authentication from the attacker, not the first attempt.' },
      { id: 'accounts', type: 'set', points: 10, short: 'Compromised accounts', title: 'Compromised accounts',
        task: 'Which accounts did the attacker <b>successfully use</b>? Enter the account names.',
        label: 'Account names', placeholder: 'e.g., jdoe, svc-example',
        answer: A('accounts'),
        hint: 'Look for successful authentications from the attacker’s address, and from FS02 (10.40.2.15) after the EDR credential-dumping alert. The spray targets only failed.',
        debrief: '<p>Two accounts were compromised. mrios was used for the VPN session and the remote desktop logon to FS02. After the LSASS memory dump on FS02 at 02:41, svc-backup authenticated to the domain controller from FS02, which it never does: its normal logons come from the backup server BKP01. Minutes later a persistence task was created on DC01 under svc-backup. The four spray targets saw only failures.</p><p>The response disabled mrios at 03:05 but did not reset svc-backup until 05:20, more than two hours after it was used from FS02. The auditor should note that containment covered the obvious account and missed the second one for most of the night.</p>',
        reviewNote: 'Correlate successful logons by source address and host, not only by user.' },
      { id: 'order', type: 'set', points: 14, short: 'Out-of-order actions', title: 'Response actions taken out of order',
        task: 'Review the action log. Enter the ID of each action that was taken <b>too early</b>, that is, before a step that must come first had been done (contain before eradicate, capture volatile memory before powering off, collect evidence before cleaning a host, eradicate before recovery).',
        label: 'Action IDs', placeholder: 'e.g., A01, A02',
        answer: A('order'),
        hint: 'For each host, line up its actions in time. Ask whether containment, memory capture, and evidence collection on that host happened before any cleanup or power-off, and whether every eradication was finished before recovery began.',
        debrief: '<p>Four actions jumped ahead. <b>A03</b> cleaned WS-AP-14 before it was isolated (A06) and before its memory was captured (A07), so malicious processes were killed before anyone recorded them. <b>A04</b> powered off FS02 with no memory capture, destroying the running processes, network connections, and any credential material in memory; the disk image taken afterward (A05) cannot recover them. <b>A09</b> restored FS02 to production while the attacker’s persistence on DC01 and the stolen svc-backup credential were still live (A10, A11). <b>A10</b> deleted the persistence from DC01 before DC01 evidence was collected (A12).</p><p>The containment, imaging, and credential-reset actions were the right steps, several of them late. The correct order is contain, preserve evidence by order of volatility (memory and network state, then disk), eradicate, then recover. The auditor should recommend updating the IR playbook with host-level collection steps and training on order of volatility.</p>',
        reviewNote: 'Contain, then preserve volatile evidence first, then eradicate, then recover.' },
      { id: 'hash', type: 'set', points: 10, short: 'Hash mismatch', title: 'Image integrity',
        task: 'Which collected item’s <b>recomputed SHA-256</b> does not match the hash recorded at acquisition? Enter the item ID.',
        label: 'Item ID', placeholder: 'e.g., IMG-01',
        answer: A('hash'),
        hint: 'In the Custody and integrity tab, compare recorded_sha256 with recomputed_sha256 using “differs from.”',
        debrief: '<p>IMG-03, the WS-AP-14 disk image, no longer matches the hash recorded when it was acquired. Nine characters in the middle of the value differ, so the image as it exists today is not the image that was collected. The other five items match.</p><p>A mismatch means the auditor cannot show the evidence is unaltered. IMG-03 should not be relied on for legal purposes, and the custody record for that drive explains why: it has an unexplained break. The recommendation is to keep a working copy for analysis and never handle the original, and to verify hashes at every transfer.</p>',
        reviewNote: 'Compare recorded and recomputed hashes for every evidence item.' },
      { id: 'custody', type: 'set', points: 14, short: 'Custody defects', title: 'Defective chain-of-custody forms',
        task: 'Which chain-of-custody forms are <b>defective</b>, meaning a missing hash, a missing signature, or a break in the chain? Enter the form IDs.',
        label: 'Form IDs', placeholder: 'e.g., CoC-01',
        answer: A('custody'),
        hint: 'For each form, check that a hash was recorded, every transfer has both signatures, and each person who releases the item is the person who last received it.',
        debrief: '<p>Two forms are defective. <b>CoC-02</b> (WS-AP-14 memory) has no hash recorded at collection, and the evidence custodian never signed for receipt. <b>CoC-03</b> (WS-AP-14 disk) shows the custodian receiving the drive on September 12, then Daniel Kim of IT support releasing it to the examiner 18 hours later, with no record of how he obtained it. The seal was also replaced without a reason. This is the same item whose hash no longer matches.</p><p>CoC-01 and CoC-04 are complete. The auditor should report that two of four evidence items have custody gaps, that one of them also fails integrity, and recommend custody training, a single custodian log for the evidence locker, and hash verification on every transfer.</p>',
        reviewNote: 'Each custody form needs a hash, both signatures on every transfer, and an unbroken chain of names.' },
      { id: 'retention', type: 'choice', points: 13, short: 'Log retention', title: 'Evaluate log retention',
        task: 'Read Logging Standard LS-2 and the log source inventory in the Policies tab. Which conclusion about log retention is best supported?',
        options: ['Every source complies, because the incident night was preserved in the IR log exports', 'The VPN log fails the 12-month rule, so earlier use of the stolen credential cannot be ruled out', 'The EDR log fails the standard, because its console keeps only 30 days of searchable data', 'Log retention is an IT operations setting, so it falls outside the scope of a post-incident audit'],
        answer: 1,
        hint: 'Compare each source’s effective retention with LS-2. A copy made by the response team for one night is not retention.',
        debrief: '<p>The VPN appliance keeps 14 days locally and does not forward to the SIEM, so its effective retention is 14 days against a 12-month requirement. The incident night survives only because the team exported it (IMG-05). Investigators cannot check whether the stolen credential, or the same attacker address, was used over VPN before September 12. The EDR console holds 30 days, but the SIEM copy holds 365 days, which meets LS-2.</p><p>The auditor should recommend forwarding the VPN log to the SIEM, restoring NTP synchronization on the appliance, and adding a log source inventory review to the logging control. Retention failures matter most after an incident, when the missing history is the history the investigators need.</p>',
        reviewNote: 'Effective retention is what the organization keeps by design, compared with the standard.' },
      { id: 'report', type: 'text', points: 15, short: 'Audit findings', title: 'Write the post-incident audit findings', reportTitle: 'Post-incident audit findings',
        task: 'Write the findings summary for the audit committee. Be specific and use times in UTC.',
        fields: [
          { key: 'timeline', label: 'What happened: key timeline in UTC', min: 50, placeholder: 'Credential theft, initial access, lateral movement, second account, detection, containment.' },
          { key: 'response', label: 'Response findings: sequence and order of volatility', min: 40, placeholder: 'Which actions were out of order and what evidence was lost.' },
          { key: 'evidence', label: 'Evidence findings: integrity, custody, time sync, and retention', min: 40, placeholder: 'Hash mismatch, custody defects, the clock offset, and VPN retention.' },
          { key: 'rec', label: 'Recommendations', min: 40, placeholder: 'Address the causes in the playbook, logging, and evidence handling.' }
        ],
        hint: 'Organize the summary around the committee’s two questions: did the response follow good practice, and will the evidence hold up?',
        debrief: '<p><b>Model findings.</b> <b>Timeline:</b> On September 11 at 19:22 an ISO attachment opened on WS-AP-14 ran an infostealer that read mrios’s saved passwords; the medium alert was not triaged. On September 12 from 01:31 the attacker sprayed passwords, then sent nine denied MFA pushes; the tenth was approved at 02:13:07 (initial access) and a VPN session began. The attacker reached FS02 by RDP at 02:27, dumped LSASS at 02:41, used svc-backup against DC01 from 02:49, planted a scheduled task on DC01 at 02:56, and staged 2.1 GB of HR files. The SOC triaged the EDR alert at 03:02; mrios was disabled at 03:05, but the VPN session stayed open until 03:26 normalized time. <b>Response:</b> four actions were out of order: WS-AP-14 cleaned before isolation and memory capture (A03), FS02 powered off with no memory capture (A04), FS02 restored before eradication was complete (A09), and DC01 cleaned before its evidence was collected (A10). svc-backup stayed usable for over two hours. <b>Evidence:</b> IMG-03 fails hash verification and its form CoC-03 has a custody break; CoC-02 lacks a hash and a receipt signature; the VPN appliance clock was 38 minutes slow; VPN logs are kept only 14 days against a 12-month standard. <b>Recommendations:</b> update the IR playbook for order of volatility and host-level sequencing, terminate VPN sessions when an account is disabled, reset all credentials exposed on a compromised host at containment, restore NTP and forward VPN logs to the SIEM, retrain staff on custody with hash checks at every transfer, and adopt phishing-resistant MFA.</p><p>Your wording will differ. Check that each element is specific and that the recommendations address causes.</p>',
        reviewNote: 'Cover the timeline, response sequencing, evidence integrity and custody, and logging, with specific times.' }
    ],

        rows.forEach(function (r) { by[r.event_id.toUpperCase()] = r; });

        tl.innerHTML = '<div class="b8-tl-bar"><div><label for="tl-off">VPN offset (minutes to add)</label><input type="number" id="tl-off" step="1" value="' + esc(off) + '"></div>' +

  window.LAB_SELFTEST = function () {
    var log = [], P = [];
    // Offset from matched sessions
    var au = {}; X.auth.forEach(function (a) { if (a.session_ref) au[a.session_ref] = a; });
    var diffs = X.vpn.filter(function (v) { return v.event === 'Session start'; }).map(function (v) { return (Date.parse(au[v.session_id].time_utc.replace(' ', 'T') + 'Z') - Date.parse(v.device_time.replace(' ', 'T') + 'Z')) / 60000; });
    var lo = Math.min.apply(null, diffs), hi = Math.max.apply(null, diffs), off = Math.round(diffs.reduce(function (s, x) { return s + x; }, 0) / diffs.length);
